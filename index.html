<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sound Forge</title>
<style>
:root{--bg:#0d0e12;--panel:#15171d;--panel2:#1c1f27;--line:#2a2e39;--text:#d9dce4;--dim:#878d9c;--accent:#f4b6cf}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:13px/1.3 "Segoe UI",system-ui,sans-serif;user-select:none}
button{font:inherit;color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:4px 9px;cursor:pointer;white-space:nowrap}
button:hover{border-color:#4c5263}
button.on{background:#353a4a;border-color:#6a7090;color:#fff}
button.rec.on{background:#7a2433;border-color:#d0455e}
select{font:inherit;color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:3px 4px}
input[type=range]{accent-color:var(--accent);width:90px}
label{color:var(--dim);display:flex;align-items:center;gap:6px}
label b{color:var(--text);min-width:52px}
.seg{display:flex;gap:2px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:3px}
.seg button{border:none;background:transparent;padding:4px 9px}
.seg button.on{background:#2f3442}
.seg.small button{padding:2px 6px;font-size:12px;color:var(--dim)}
.seg.small button.on{color:#fff}
header{display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.logo{width:32px;height:32px;border-radius:8px;background:#fff;color:#111;display:grid;place-items:center;font-weight:700;font-size:18px}
.play{width:40px;height:40px;border-radius:50%;background:#fff;color:#111;font-size:16px;border:none}
.spacer{flex:1}
.menuWrap{position:relative}
.menu{position:absolute;right:0;top:110%;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:6px;display:flex;flex-direction:column;gap:4px;z-index:20;min-width:240px}
.menu[hidden]{display:none}
.menu button{text-align:left}
#songArea{display:flex;border-bottom:1px solid var(--line)}
#sectionsPanel{width:540px;flex:none;padding:8px 12px;border-right:1px solid var(--line)}
.phead{display:flex;align-items:center;gap:6px;color:var(--dim);margin-bottom:8px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border-radius:8px;padding:6px 12px;display:flex;gap:6px;align-items:center}
.chip i{width:8px;height:8px;border-radius:2px;display:inline-block}
.chip small{color:var(--dim)}
#songPanel{flex:1;padding:8px 12px;min-width:0}
#arr{display:flex;gap:4px;min-height:54px;background:#101116;border-radius:8px;padding:4px;overflow-x:auto}
.blk{border-radius:6px;padding:4px 8px;color:#222;position:relative;cursor:pointer;flex:none;opacity:.75;border:2px solid transparent}
.blk.cur{opacity:1;border-color:#fff}
.blk small{display:block;opacity:.7}
.blk .x{position:absolute;right:3px;top:1px;font-size:11px;opacity:.6}
.tracksHead{display:flex;gap:8px;padding:6px 12px;color:var(--dim)}
.tracksHead b{color:var(--accent)}
.trow{display:flex;border-bottom:1px solid #1f222a}
.trow.sel{background:#181b22}
.tctl{width:540px;flex:none;padding:5px 8px 5px 10px;border-left:4px solid var(--c);display:flex;flex-direction:column;gap:4px;cursor:pointer}
.tctl .l1,.tctl .l2{display:flex;align-items:center;gap:6px}
.tname{font-weight:600;color:var(--c);width:84px}
.tctl .l2 select{width:150px}
.tview{flex:1;position:relative;min-width:0;cursor:pointer}
.tview canvas{position:absolute;inset:0;width:100%;height:100%}
.trow.hdr{height:24px}
.trow.hdr .tctl{border-left-color:transparent;cursor:default}
.ph{position:absolute;top:0;bottom:0;width:2px;background:#ffffffb0;left:0;pointer-events:none;display:none}
.ms{padding:2px 7px;font-size:12px}
.ms.on.m{background:#6b3a2a}.ms.on.s{background:#5a5a20}
#editor{border-top:1px solid var(--line)}
.etool{display:flex;align-items:center;gap:6px;padding:8px 12px;flex-wrap:wrap}
.pill{border-radius:20px;padding:5px 14px;color:#111;font-weight:600}
.prog{color:var(--dim);margin-left:auto}
#barRow{position:relative;height:28px;border-bottom:1px solid var(--line)}
.bcell{position:absolute;top:2px;display:flex;gap:2px;align-items:center;overflow:hidden;font-size:11px;color:var(--dim);padding-left:3px}
.bcell select{padding:1px 2px;font-size:11px}
.bcell button{padding:0 4px;font-size:11px}
#rollWrap{position:relative;height:280px;overflow-y:auto;overflow-x:hidden}
#roll{display:block;cursor:crosshair}
#rollPh{position:absolute;top:0;width:2px;background:#ffffffc0;pointer-events:none;display:none}
#kbArea{border-top:1px solid var(--line);padding:6px 12px 10px}
.kbhead{display:flex;align-items:center;gap:10px;color:var(--dim);margin-bottom:6px}
#hint{color:var(--text)}
#hint em{color:#8fd6ff;font-style:normal}
#kb{position:relative;height:120px;display:flex}
.wk{flex:1;background:#eef0f3;border:1px solid #9aa;border-radius:0 0 6px 6px;color:#333;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;font-size:11px;padding-bottom:4px;cursor:pointer}
.wk small{color:#889}
.bk{position:absolute;top:0;height:62%;background:#23262e;border-radius:0 0 5px 5px;color:#ccd;font-size:10px;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;padding-bottom:4px;cursor:pointer;z-index:2}
.wk.scale{background:#dff4e6}.bk.scale{background:#2c4a3a}
.wk.chord{background:#cfe6ff}.bk.chord{background:#3b6a9a}
.wk.down{background:#7fe0a8!important}.bk.down{background:#3fbf7a!important}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#2b2f3b;border:1px solid #4a5060;padding:8px 16px;border-radius:8px;display:none;z-index:50}
</style>
</head>
<body>
<header>
  <div class="logo">∿</div>
  <div class="seg" id="genres"></div>
  <div class="seg" id="styles"></div>
  <label>Tempo <input type="range" id="tempo" min="50" max="180"> <b id="tempoV"></b></label>
  <label>Swing <input type="range" id="swing" min="0" max="60"> <b id="swingV"></b></label>
  <label>Bars <select id="bars"><option>4</option><option>8</option><option>16</option></select></label>
  <label>Key <select id="keyRoot"></select><select id="keyMode"></select></label>
  <span class="spacer"></span>
  <button id="openBtn" title="Open project (.json)">📂</button>
  <input type="file" id="fileIn" accept=".json,application/json" hidden>
  <div class="menuWrap">
    <button id="exportBtn">Export</button>
    <div class="menu" id="exportMenu" hidden>
      <button data-x="song">Song → WAV</button>
      <button data-x="loop">Section loop → WAV (seamless)</button>
      <button data-x="midi">Song → MIDI</button>
      <button data-x="json">Save project (.json)</button>
    </div>
  </div>
  <button id="playBtn" class="play" title="Play / pause (Space)">▶</button>
</header>

<section id="songArea">
  <div id="sectionsPanel">
    <div class="phead">Sections <span class="spacer"></span>
      <button id="secNew">+ New</button><button id="secDup">Duplicate</button><button id="secDel">Delete</button><button id="secAdd" title="Append this section to the song">+ to song</button>
    </div>
    <div class="chips" id="chips"></div>
  </div>
  <div id="songPanel">
    <div class="phead"><span id="songInfo"></span><span class="spacer"></span>
      <div class="seg" id="modeSeg"><button data-m="loop">Loop section</button><button data-m="song">Play song</button></div>
    </div>
    <div id="arr"></div>
  </div>
</section>

<section>
  <div class="tracksHead">Tracks · <b id="secName"></b><span>settings here only change this section</span></div>
  <div id="tracks"></div>
</section>

<section id="editor">
  <div class="etool">
    <span class="pill" id="ePill"></span>
    <select id="eInst"></select>
    <span style="color:var(--dim)">Note</span>
    <select id="eRes"><option value="1">1/16</option><option value="2">1/8</option><option value="4" selected>1/4</option><option value="8">1/2</option><option value="16">1</option></select>
    <button id="eRec" class="rec">● Record</button>
    <button id="eClear">Clear</button>
    <button id="eUndo">Undo</button>
    <span style="width:8px"></span>
    <button id="eChords">New chords</button>
    <button id="eBeat">New beat</button>
    <button id="eBacking">Build backing</button>
    <span class="prog" id="eProg"></span>
    <button id="eMelody" style="background:#f4d6e3;color:#222">✦ New melody</button>
  </div>
  <div id="barRow"></div>
  <div id="rollWrap"><canvas id="roll"></canvas><div id="rollPh"></div></div>
</section>

<section id="kbArea">
  <div class="kbhead">Keyboard
    <div class="seg small" id="kbOct"><button data-o="48">Low</button><button data-o="60">Middle</button><button data-o="72">High</button></div>
    <span id="hint">Play with your computer keys: Z S X D C… (lower octave) and Q 2 W 3 E… (upper). Record writes into the selected track.</span>
  </div>
  <div id="kb"></div>
</section>
<div id="toast"></div>

<script>
'use strict';
// ---------- helpers ----------
const $ = s => document.querySelector(s);
const el = (tag, attrs = {}, ...kids) => {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'class') e.className = v;
    else if (k === 'style') e.style.cssText = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v);
  }
  for (const c of kids) if (c != null) e.append(c);
  return e;
};
const mod = (a, n) => ((a % n) + n) % n;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const rnd = a => a[Math.floor(Math.random() * a.length)];
const wpick = opts => { let t = 0; for (const o of opts) t += o[1]; let r = Math.random() * t; for (const o of opts) if ((r -= o[1]) <= 0) return o[0]; return opts[0][0]; };
const uid = () => Math.random().toString(36).slice(2, 9);
const clone = o => JSON.parse(JSON.stringify(o));
const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
function toast(msg, ms = 2200) { const t = $('#toast'); t.textContent = msg; t.style.display = 'block'; clearTimeout(toast.h); if (ms) toast.h = setTimeout(() => t.style.display = 'none', ms); }

// ---------- music theory ----------
const NOTE = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
const SCALES = { minor: [0, 2, 3, 5, 7, 8, 10], major: [0, 2, 4, 5, 7, 9, 11], dorian: [0, 2, 3, 5, 7, 9, 10], phrygian: [0, 1, 3, 5, 7, 8, 10], harmonic: [0, 2, 3, 5, 7, 8, 11], lydian: [0, 2, 4, 6, 7, 9, 11] };
const MODE_NAMES = { minor: 'minor', major: 'major', dorian: 'dorian', phrygian: 'phrygian', harmonic: 'harm. minor', lydian: 'lydian' };
const PROGS = {
  minor: [[0, 5, 2, 6], [0, 3, 4, 0], [0, 6, 5, 6], [0, 5, 3, 4], [0, 2, 5, 6], [0, 3, 6, 2], [5, 6, 0, 0], [0, 4, 5, 3], [0, 0, 5, 6], [0, 3, 0, 4], [0, 4, 0, 4]],
  major: [[0, 4, 5, 3], [0, 3, 4, 0], [0, 5, 3, 4], [0, 3, 5, 4], [5, 3, 0, 4], [0, 2, 3, 4]],
  dorian: [[0, 3, 0, 3], [0, 6, 3, 0], [0, 1, 6, 0], [0, 3, 6, 0]],
  phrygian: [[0, 1, 0, 6], [0, 1, 5, 0], [0, 5, 1, 0], [0, 6, 1, 0]],
  harmonic: [[0, 3, 4, 0], [0, 5, 3, 4], [0, 3, 5, 4], [5, 3, 4, 4]],
  lydian: [[0, 1, 0, 1], [0, 4, 1, 0], [0, 1, 5, 4]],
};
const SPB = 16; // 16th steps per bar
const TRACKS = ['melody', 'chords', 'bass', 'arp', 'pad', 'drums'];
const TI = { melody: { n: 'Melody', c: '#f28bb0' }, chords: { n: 'Chords', c: '#b9a0f0' }, bass: { n: 'Bass', c: '#8ec5f0' }, arp: { n: 'Arpeggio', c: '#8ef0c8' }, pad: { n: 'Pad', c: '#f0c88e' }, drums: { n: 'Drums', c: '#f0e08e' } };
const DENS = ['off', 'soft', 'normal', 'busy'];
const DRUM_LANES = [{ p: 49, n: 'Hit' }, { p: 46, n: 'OpenHat' }, { p: 42, n: 'Hat' }, { p: 45, n: 'Tom' }, { p: 39, n: 'Clap' }, { p: 38, n: 'Snare' }, { p: 36, n: 'Kick' }];
const RANGES = { melody: [48, 96], chords: [45, 84], bass: [24, 60], arp: [48, 96], pad: [48, 90] };
const SEC_COLORS = ['#f4a6c4', '#a6c8f4', '#b8f4a6', '#f4d9a6', '#cfa6f4', '#a6f4e6'];

// ---------- instruments ----------
// osc: t=type|noise, d=detune cents, o=semitone offset, g=gain. f: filter. e: [attack, decay, sustain, release]. g: level. vib: [rate, cents]
const PATCHES = {
  melody: {
    'Deep space reese': { osc: [{ t: 'sawtooth', d: -14 }, { t: 'sawtooth', d: 14 }, { t: 'sine', o: -12, g: .5 }], f: { freq: 700, q: 5, env: 1800, fd: .5 }, e: [.03, .4, .7, .5], g: .12, rev: .4, del: .25, vib: [.25, 10], oct: -1 },
    'Retro square': { osc: [{ t: 'square', d: -6 }, { t: 'square', d: 6 }], f: { freq: 2200, q: 2, env: 1500, fd: .2 }, e: [.01, .2, .55, .2], g: .08, rev: .25, del: .35, vib: [5.5, 8] },
    'Glass lead': { osc: [{ t: 'triangle' }, { t: 'sine', o: 12, g: .5 }], f: { freq: 5000, q: 1 }, e: [.005, .5, .4, .6], g: .22, rev: .45, del: .3 },
    'Rusty lead': { osc: [{ t: 'square' }, { t: 'sawtooth', d: 9 }], f: { freq: 1100, q: 6, env: 1800, fd: .3 }, e: [.01, .3, .6, .3], g: .07, drive: 3, rev: .3, del: .2, vib: [5.5, 15] },
    'Brass': { osc: [{ t: 'sawtooth', d: -5 }, { t: 'sawtooth', d: 5 }], f: { freq: 500, q: 1.5, env: 2600, fd: .35 }, e: [.07, .35, .75, .35], g: .1, rev: .45, vib: [5, 6] },
    'Flute': { osc: [{ t: 'sine' }, { t: 'triangle', g: .3 }, { t: 'noise', g: .05 }], f: { freq: 3200, q: .7 }, e: [.06, .2, .85, .25], g: .2, rev: .45, vib: [5, 12] },
    'Lo-fi keys': { osc: [{ t: 'triangle' }, { t: 'sine', o: 12, g: .3 }], f: { freq: 1800, q: .7 }, e: [.005, .9, .2, .4], g: .25, rev: .3, vib: [.6, 7] },
    'Music box': { osc: [{ t: 'sine' }, { t: 'sine', o: 24, g: .25 }], f: { freq: 8000 }, e: [.002, .9, 0, .8], g: .25, rev: .55, del: .25 },
  },
  chords: {
    'Tension strings': { osc: [{ t: 'sawtooth', d: -10 }, { t: 'sawtooth' }, { t: 'sawtooth', d: 10 }], f: { freq: 1500, q: .7, env: 400 }, e: [.35, .5, .8, .8], g: .045, rev: .55, vib: [5, 6] },
    'Warm saw stack': { osc: [{ t: 'sawtooth', d: -7 }, { t: 'sawtooth', d: 7 }], f: { freq: 1800, q: 1, env: 1500, fd: .4 }, e: [.01, .6, .5, .4], g: .055, rev: .4, del: .15 },
    'Electric piano': { osc: [{ t: 'sine' }, { t: 'sine', o: 12, g: .2 }, { t: 'triangle', g: .3 }], f: { freq: 3000 }, e: [.003, 1.2, .25, .5], g: .1, rev: .3, vib: [4, 4] },
    'Brass section': { osc: [{ t: 'sawtooth', d: -6 }, { t: 'sawtooth', d: 6 }], f: { freq: 650, q: 1.2, env: 2000, fd: .4 }, e: [.1, .4, .7, .4], g: .05, rev: .5 },
    'Soft strings': { osc: [{ t: 'triangle' }, { t: 'sawtooth', d: 8, g: .5 }], f: { freq: 1200, q: .7 }, e: [.4, .5, .85, 1], g: .07, rev: .55, vib: [5, 7] },
    'Choir': { osc: [{ t: 'triangle', d: -8 }, { t: 'triangle', d: 8 }, { t: 'sine', o: 12, g: .3 }], f: { freq: 1400, q: 1 }, e: [.5, .4, .9, 1.2], g: .08, rev: .65, vib: [5, 10] },
  },
  bass: {
    'Braam': { osc: [{ t: 'sawtooth', d: -15 }, { t: 'sawtooth', d: 15 }, { t: 'square', o: -12, g: .5 }], f: { freq: 220, q: 5, env: 900, fd: .6 }, e: [.06, .5, .8, .5], g: .13, drive: 2, rev: .25 },
    'Synth bass': { osc: [{ t: 'sawtooth' }, { t: 'square', o: -12, g: .5 }], f: { freq: 380, q: 6, env: 1600, fd: .12 }, e: [.003, .2, .4, .12], g: .15 },
    'Sub': { osc: [{ t: 'sine' }, { t: 'triangle', g: .25 }], f: { freq: 700 }, e: [.005, .3, .9, .15], g: .4 },
    'Distorted bass': { osc: [{ t: 'sawtooth' }], f: { freq: 480, q: 3, env: 800, fd: .2 }, e: [.005, .3, .6, .15], g: .12, drive: 6 },
    'Pluck bass': { osc: [{ t: 'triangle' }, { t: 'square', g: .15 }], f: { freq: 800, q: 2, env: 1200, fd: .15 }, e: [.003, .35, .1, .2], g: .32 },
  },
  arp: {
    'Ostinato strings': { osc: [{ t: 'sawtooth', d: -6 }, { t: 'sawtooth', d: 6 }], f: { freq: 2200, q: 1, env: 1200, fd: .1 }, e: [.005, .18, .25, .15], g: .06, rev: .4 },
    'Chip arp': { osc: [{ t: 'square' }], f: { freq: 5000 }, e: [.002, .12, .3, .08], g: .06, del: .35, rev: .2 },
    'Crystal pluck': { osc: [{ t: 'triangle' }, { t: 'square', o: 12, g: .2 }], f: { freq: 6000 }, e: [.002, .3, 0, .3], g: .14, rev: .45, del: .3 },
    'Harp': { osc: [{ t: 'triangle' }, { t: 'sine', o: 12, g: .3 }], f: { freq: 3500 }, e: [.002, .9, 0, .9], g: .2, rev: .5 },
    'Metal pluck': { osc: [{ t: 'square' }, { t: 'sawtooth', o: 19, g: .3 }], f: { type: 'bandpass', freq: 1800, q: 3 }, e: [.002, .25, 0, .2], g: .14, drive: 2, rev: .35, del: .2 },
  },
  pad: {
    'Metal shimmer': { osc: [{ t: 'sawtooth', d: -8 }, { t: 'sawtooth', d: 8 }, { t: 'sine', o: 12, g: .4 }], f: { type: 'bandpass', freq: 2400, q: .8 }, e: [1.2, 1, .8, 2], g: .06, rev: .7, vib: [.3, 15] },
    'Warm pad': { osc: [{ t: 'sawtooth', d: -12 }, { t: 'sawtooth', d: 12 }], f: { freq: 900, q: 1 }, e: [.8, 1, .8, 1.5], g: .05, rev: .55 },
    'Dark drone': { osc: [{ t: 'sawtooth' }, { t: 'square', o: -12, g: .5 }], f: { freq: 450, q: 3 }, e: [1.5, 1, .9, 2], g: .05, drive: 1.5, rev: .6 },
    'Air choir': { osc: [{ t: 'triangle', d: -10 }, { t: 'triangle', d: 10 }, { t: 'noise', g: .03 }], f: { freq: 1800, q: .8 }, e: [1, 1, .85, 1.8], g: .08, rev: .7, vib: [5, 8] },
  },
};
const KITS = {
  'Cinematic hits': { kick: { f0: 110, f1: 36, dec: 1.0 }, snare: { tone: 150, hp: 700, dec: .45 }, tom: { f0: 130, f1: 60, dec: .7 }, cine: 1, rev: .5, g: 1 },
  'Synthwave kit': { kick: { f0: 160, f1: 45, dec: .45 }, snare: { tone: 190, hp: 1200, dec: .3 }, tom: { f0: 180, f1: 90, dec: .4 }, rev: .35, g: .9 },
  '808 kit': { kick: { f0: 120, f1: 42, dec: 1.3 }, snare: { tone: 230, hp: 2500, dec: .16 }, tom: { f0: 160, f1: 80, dec: .5 }, rev: .12, g: .95 },
  'Industrial kit': { kick: { f0: 140, f1: 50, dec: .35 }, snare: { tone: 260, hp: 800, dec: .25 }, tom: { f0: 120, f1: 70, dec: .3 }, rev: .25, g: .8, drive: 4 },
  'Tribal drums': { kick: { f0: 95, f1: 48, dec: .7 }, snare: { tone: 210, hp: 1500, dec: .2 }, tom: { f0: 150, f1: 85, dec: .5 }, cine: 1, rev: .4, g: 1 },
  'Lo-fi kit': { kick: { f0: 100, f1: 45, dec: .4 }, snare: { tone: 180, hp: 1800, dec: .18 }, tom: { f0: 140, f1: 80, dec: .3 }, rev: .15, g: .9, lp: 4200, hatDec: .04 },
};
const instList = k => Object.keys(k === 'drums' ? KITS : PATCHES[k]);
const patchOf = (k, name) => PATCHES[k][name] || Object.values(PATCHES[k])[0];

// ---------- drum beats: [pitch, pattern, density level]; x = accent, o = soft ----------

  const names = []; sec.chords.forEach((d, i) => { if (i === 0 || d !== sec.chords[i - 1] || i % 4 === 0) names.push(chordInfo(d).name); });
  $('#eProg').textContent = `${NOTE[root]} ${MODE_NAMES[mode]} · ${names.slice(0, 8).join(' – ')}`;
  $('#eRec').classList.toggle('on', recOn);
  // sync row instrument select
  renderTracksSelectSync();
}
function renderTracksSelectSync() {
  document.querySelectorAll('#tracks .trow:not(.hdr)').forEach((row, i) => { const s = row.querySelector('.l2 select'); if (s) s.value = cur().tracks[TRACKS[i]].inst; });
}
function renderBarRow() {
  const sec = cur(), g = rollGeom(), host = $('#barRow'); host.innerHTML = '';
  const ROMAN = ['I', 'II', 'III', 'IV', 'V', 'VI', 'VII'];
  for (let b = 0; b < sec.bars; b++) {
    const w = SPB * g.px;
    const s = el('select', { title: 'Chord of this bar (re-voices chords/bass/arp/pad here)', onchange: e => setBarChord(b, +e.target.value) });
    for (let d = 0; d < 7; d++) { const ci = chordInfo(d); s.append(el('option', { value: d }, (ci.q === '' || ci.q === '+' ? ROMAN[d] : ROMAN[d].toLowerCase()) + ' ' + ci.name)); }
    s.value = sec.chords[b];
    const cell = el('div', { class: 'bcell', style: `left:${GUT + b * w}px;width:${w - 2}px` }, String(b + 1), s);
    if (w > 120) cell.append(
      el('button', { title: 'Copy this bar (selected track)', onclick: () => { barClip = sec.tracks[sel].notes.filter(n => Math.floor(n.s / SPB) === b).map(n => ({ ...n, s: n.s - b * SPB })); toast('Bar ' + (b + 1) + ' copied'); } }, '⧉'),
      el('button', { title: 'Paste into this bar', onclick: () => { if (!barClip) return; pushUndo(); const tr = sec.tracks[sel]; tr.notes = tr.notes.filter(n => Math.floor(n.s / SPB) !== b).concat(barClip.map(n => ({ ...n, s: n.s + b * SPB }))); drawRoll(); drawOverview(); save(); } }, '⎘'),
      el('button', { title: 'Clear this bar (selected track)', onclick: () => { pushUndo(); const tr = sec.tracks[sel]; tr.notes = tr.notes.filter(n => Math.floor(n.s / SPB) !== b); drawRoll(); drawOverview(); save(); } }, '✕'));
    host.append(cell);
  }
}
function setBarChord(b, d) {
  pushUndo();
  const sec = cur(); sec.chords[b] = d;
  for (const k of ['chords', 'bass', 'arp', 'pad']) {
    const tr = sec.tracks[k];
    tr.notes = tr.notes.filter(n => Math.floor(n.s / SPB) !== b).concat(genBar(k, sec, b));
  }
  renderAll(); save();
}
function drawRoll() {
  const cv = $('#roll'), g = rollGeom(), sec = cur(), tr = sec.tracks[sel], dpr = devicePixelRatio || 1;
  cv.width = g.W * dpr; cv.height = g.H * dpr; cv.style.width = g.W + 'px'; cv.style.height = g.H + 'px';
  const c = cv.getContext('2d'); c.setTransform(dpr, 0, 0, dpr, 0, 0);
  c.fillStyle = '#121419'; c.fillRect(0, 0, g.W, g.H);
  c.font = '10px Segoe UI'; c.textBaseline = 'middle';
  const chordPcs = sec.chords.map(d => chordInfo(d).pcs);
  g.rows.forEach((p, i) => {
    const y = i * g.rh;
    if (sel === 'drums') {
      c.fillStyle = i % 2 ? '#171a21' : '#1b1e26'; c.fillRect(GUT, y, g.W - GUT, g.rh);
      c.fillStyle = '#aab'; c.fillText(DRUM_LANES[i].n, 3, y + g.rh / 2);
      return;
    }
    const pc = mod(p, 12), black = [1, 3, 6, 8, 10].includes(pc);
    c.fillStyle = black ? '#14161c' : '#191c23'; c.fillRect(GUT, y, g.W - GUT, g.rh);
    if (inScale(pc)) { c.fillStyle = 'rgba(120,220,170,.04)'; c.fillRect(GUT, y, g.W - GUT, g.rh); }
    for (let b = 0; b < sec.bars; b++) if (chordPcs[b].includes(pc)) { c.fillStyle = 'rgba(140,190,255,.09)'; c.fillRect(GUT + b * SPB * g.px, y, SPB * g.px, g.rh); }
    c.fillStyle = black ? '#2a2d36' : '#d8dbe2'; c.fillRect(0, y, GUT - 2, g.rh - 1);
    c.fillStyle = black ? '#99a' : '#334';
    if (!black || g.rh >= 12) c.fillText(NOTE[pc] + (pc === 0 ? (Math.floor(p / 12) - 1) : ''), 4, y + g.rh / 2);
    if (pc === 0) { c.fillStyle = '#3a3f4d'; c.fillRect(GUT, y + g.rh - 1, g.W - GUT, 1); }
  });
  for (let s = 0; s <= g.steps; s++) {
    const x = GUT + s * g.px;
    c.fillStyle = s % SPB === 0 ? '#454a5a' : s % 4 === 0 ? '#2a2e38' : s % noteRes === 0 ? '#1f222a' : null;
    if (c.fillStyle && (s % SPB === 0 || s % 4 === 0 || s % noteRes === 0)) c.fillRect(x, 0, 1, g.H);
  }
  c.fillStyle = TI[sel].c;
  for (const n of tr.notes) {
    const r = g.rows.indexOf(n.p); if (r < 0) continue;
    c.globalAlpha = .45 + .55 * (n.v ?? .8);
    c.fillRect(GUT + n.s * g.px + 1, r * g.rh + 1, Math.max(3, n.l * g.px - 2), g.rh - 2);
  }
  c.globalAlpha = 1;
  if (recOn && !play.on) { c.fillStyle = '#ff5a75'; c.fillRect(GUT + cursor * g.px, 0, 2, g.H); }
}
function renderEditor() {
  renderEditorTop(); renderBarRow(); drawRoll();
  const wrap = $('#rollWrap'), g = rollGeom(), notes = cur().tracks[sel].notes;
  if (sel !== 'drums' && notes.length) { // scroll the notes into view
    const avg = notes.reduce((a, n) => a + n.p, 0) / notes.length;
    wrap.scrollTop = g.rows.indexOf(Math.round(avg)) * g.rh - wrap.clientHeight / 2;
  }
}
function renderKB() {
  const kb = $('#kb'); kb.innerHTML = '';
  const whites = [0, 2, 4, 5, 7, 9, 11];
  let wi = 0; const nW = 15;
  for (let i = 0; i <= 24; i++) {
    const pc = i % 12, midi = kbBase + i, isW = whites.includes(pc);
    const key = el('div', { class: isW ? 'wk' : 'bk', 'data-m': midi,
      onpointerdown: e => { e.preventDefault(); noteOn(midi); const up = () => { noteOff(midi); removeEventListener('pointerup', up); }; addEventListener('pointerup', up); } },
      NOTE[pc] + (pc === 0 ? (midi / 12 - 1) : ''), el('small', {}, KEYLABEL[i] ? '(' + KEYLABEL[i] + ')' : ''));
    if (isW) { kb.append(key); wi++; }
    else { key.style.left = `calc(${wi / nW * 100}% - ${100 / nW * .3}%)`; key.style.width = (100 / nW * .6) + '%'; kb.append(key); }
  }
  updateHints();
}
function kbVisual(midi, on) { const k = document.querySelector(`#kb [data-m="${midi}"]`); if (k) k.classList.toggle('down', on); }
function currentBar() { const ph = playheadStep(); return Math.floor((ph && ph.sec === curId ? ph.step : cursor) / SPB) % cur().bars; }
function updateHints() {
  const ci = chordInfo(cur().chords[currentBar()]);
  document.querySelectorAll('#kb [data-m]').forEach(k => {
    const pc = mod(+k.dataset.m, 12);
    k.classList.toggle('chord', ci.pcs.includes(pc));
    k.classList.toggle('scale', !ci.pcs.includes(pc) && inScale(pc));
  });
  const h = $('#hint');
  if (lastNote == null || sel === 'drums') { if (sel === 'drums') h.textContent = 'Drums: white keys = Kick, Snare, Clap, Hat, Open hat, Tom, Hit'; return; }
  const pc = mod(lastNote, 12), n = NOTE[pc], { root, scale } = keyInfo();
  let msg;
  if (ci.pcs.includes(pc)) msg = `● <em>${n}</em> is part of the current chord (${ci.name})`;
  else if (inScale(pc)) msg = `● <em>${n}</em> fits the key — passing tone over ${ci.name}`;
  else msg = `● <em>${n}</em> is outside the key — tension!`;
  const idx = scale.findIndex(i => mod(root + i, 12) === pc);
  const next = new Set();
  if (idx >= 0) [1, -1, 2, -2].forEach(o => next.add(NOTE[mod(root + scale[mod(idx + o, 7)], 12)]));
  ci.pcs.forEach(p => next.add(NOTE[p]));
  next.delete(n);
  h.innerHTML = msg + ` · nice next notes: <em>${[...next].join(', ')}</em>`;
}
function renderAll() { renderTop(); renderSections(); renderTracks(); renderEditor(); updateHints(); }

// ---------- events ----------
$('#playBtn').onclick = () => play.on ? stopPlay() : startPlay();
$('#tempo').oninput = e => { song.tempo = +e.target.value; $('#tempoV').textContent = song.tempo + ' BPM'; if (RT) RT.delay.delayTime.value = .75 * 60 / song.tempo; renderSections(); save(); };
$('#swing').oninput = e => { song.swing = e.target.value / 100; $('#swingV').textContent = e.target.value + '%'; save(); };
$('#bars').onchange = e => {
  pushUndo();
  const sec = cur(), nb = +e.target.value, ob = sec.bars;
  const chords = Array.from({ length: nb }, (_, i) => sec.chords[i % ob]);
  for (const k of TRACKS) {
    const tr = sec.tracks[k], src = tr.notes.filter(n => n.s < ob * SPB);
    const out = [];
    for (let rep = 0; rep * ob < nb; rep++) for (const n of src) { const s = n.s + rep * ob * SPB; if (s < nb * SPB) out.push({ ...n, s, l: Math.min(n.l, nb * SPB - s) }); }
    tr.notes = out;
  }
  sec.bars = nb; sec.chords = chords; cursor = 0;
  renderAll(); save();
};
function onKeyChange() {
  pushUndo();
  const old = keyInfo();
  const r = $('#keyRoot').value, m = $('#keyMode').value;
  song.keyRoot = r === '' ? null : +r; song.keyMode = m === '' ? null : m;
  const nw = keyInfo(), delta = mod(nw.root - old.root + 6, 12) - 6;
  for (const sec of song.sections) for (const k of TRACKS) {
    if (k === 'drums') continue;
    for (const n of sec.tracks[k].notes) {
      n.p += delta;
      if (nw.mode !== old.mode) for (const o of [0, -1, 1]) if (inScale(n.p + o)) { n.p += o; break; }
    }
  }
  if (nw.mode !== old.mode) for (const sec of song.sections) for (const k of ['chords', 'bass', 'arp', 'pad']) genTrack(sec, k);
  renderAll(); save();
}
$('#keyRoot').onchange = onKeyChange;
$('#keyMode').onchange = onKeyChange;
$('#modeSeg').onclick = e => { const m = e.target.dataset.m; if (!m) return; play.mode = m; if (play.on) { stopPlay(); startPlay(); } renderSections(); };
$('#secNew').onclick = () => {
  pushUndo();
  const base = cur(), s = newSection('Part ' + (song.sections.length + 1), base.bars, rnd(PROGS[keyInfo().mode]));
  for (const k of TRACKS) { s.tracks[k].inst = base.tracks[k].inst; s.tracks[k].oct = base.tracks[k].oct; s.tracks[k].vol = base.tracks[k].vol; }
  song.sections.push(s); song.arrangement.push(s.id); curId = s.id; renderAll(); save();
};
$('#secDup').onclick = () => {
  pushUndo();
  const s = clone(cur()); s.id = uid(); s.name = cur().name + ' 2'; s.color = SEC_COLORS[song.sections.length % SEC_COLORS.length];
  song.sections.push(s); song.arrangement.push(s.id); curId = s.id; renderAll(); save();
};
$('#secDel').onclick = () => {
  if (song.sections.length < 2) return toast('Need at least one section');
  pushUndo();
  const id = curId;
  song.sections = song.sections.filter(s => s.id !== id);
  song.arrangement = song.arrangement.filter(a => a !== id);
  if (!song.arrangement.length) song.arrangement.push(song.sections[0].id);
  curId = song.sections[0].id; renderAll(); save();
};
$('#secAdd').onclick = () => { pushUndo(); song.arrangement.push(curId); renderSections(); save(); };
$('#eInst').onchange = e => { pushUndo(); cur().tracks[sel].inst = e.target.value; renderTracksSelectSync(); save(); };
$('#eRes').onchange = e => { noteRes = +e.target.value; cursor = Math.floor(cursor / noteRes) * noteRes; drawRoll(); };
$('#eRec').onclick = () => { recOn = !recOn; undoStack.recording = false; renderEditorTop(); drawRoll(); toast(recOn ? (play.on ? 'Recording: play along, notes land at the playhead' : 'Step input: each key press writes a note and moves the red cursor (click the roll ruler to move it)') : 'Recording off'); };
$('#eClear').onclick = () => { pushUndo(); cur().tracks[sel].notes = []; drawRoll(); drawOverview(); save(); };
$('#eUndo').onclick = undo;
$('#eChords').onclick = () => {
  pushUndo();
  const sec = cur(), pool = PROGS[keyInfo().mode], old = sec.chords.join();
  for (let i = 0; i < 6 && sec.chords.join() === old; i++) sec.chords = tileProg(rnd(pool), sec.bars);
  for (const k of ['chords', 'bass', 'arp', 'pad']) genTrack(sec, k);
  snapMelodyToChords(sec);
  renderAll(); save();
};
$('#eBeat').onclick = () => { pushUndo(); const tr = cur().tracks.drums; tr.beat = makeBeat(true); if (tr.dens === 'off') tr.dens = 'normal'; genTrack(cur(), 'drums'); renderAll(); save(); };
$('#eBacking').onclick = () => { pushUndo(); genBacking(cur()); renderAll(); save(); };
$('#eMelody').onclick = () => { pushUndo(); const tr = cur().tracks.melody; if (tr.dens === 'off') tr.dens = 'normal'; genMelody(cur()); renderAll(); save(); };
$('#kbOct').onclick = e => { const o = e.target.dataset.o; if (!o) return; kbBase = +o; document.querySelectorAll('#kbOct button').forEach(b => b.classList.toggle('on', +b.dataset.o === kbBase)); renderKB(); };
$('#exportBtn').onclick = e => { e.stopPropagation(); $('#exportMenu').hidden = !$('#exportMenu').hidden; };
document.addEventListener('click', () => $('#exportMenu').hidden = true);
$('#exportMenu').onclick = e => {
  const x = e.target.dataset.x; if (!x) return;
  if (x === 'song' || x === 'loop') exportWav(x).catch(err => toast('Export failed: ' + err.message, 5000));
  else if (x === 'midi') exportMidi();
  else download(new Blob([JSON.stringify(song, null, 1)], { type: 'application/json' }), fileBase() + '.soundforge.json');
};
$('#openBtn').onclick = () => $('#fileIn').click();
$('#fileIn').onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  try { const s = JSON.parse(await f.text()); if (!s.sections || !GENRES[s.genre]) throw new Error('not a Sound Forge project'); pushUndo(); song = s; curId = s.sections[0].id; renderAll(); save(); toast('Loaded ' + f.name); }
  catch (err) { toast('Could not open: ' + err.message, 4000); }
  e.target.value = '';
};

// piano roll mouse editing
let drag = null;
const roll = $('#roll');
roll.addEventListener('contextmenu', e => e.preventDefault());
roll.addEventListener('mousedown', e => {
  const g = rollGeom(), r = roll.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top;
  const p = g.rows[Math.floor(y / g.rh)]; if (p == null) return;
  const tr = cur().tracks[sel];
  if (x < GUT) { ensureAudio(); if (sel === 'drums') playDrum(RT, tr.inst, p, AC.currentTime, .9); else playVoice(RT, patchOf(sel, tr.inst), p + 12 * tr.oct, AC.currentTime, .4, .8); return; }
  const step = clamp(Math.floor((x - GUT) / g.px), 0, g.steps - 1);
  if (recOn && !play.on && e.altKey) { cursor = Math.floor(step / noteRes) * noteRes; drawRoll(); return; }
  const hit = tr.notes.find(n => n.p === p && step >= n.s && step < n.s + n.l);
  pushUndo();
  if (hit || e.button === 2) { if (hit) tr.notes.splice(tr.notes.indexOf(hit), 1); drawRoll(); drawOverview(); save(); return; }
  const s = Math.floor(step / noteRes) * noteRes;
  const n = { s, l: sel === 'drums' ? 1 : Math.min(noteRes, g.steps - s), p, v: .8 };
  tr.notes.push(n);
  ensureAudio();
  if (sel === 'drums') playDrum(RT, tr.inst, p, AC.currentTime, .9); else playVoice(RT, patchOf(sel, tr.inst), p + 12 * tr.oct, AC.currentTime, .3, .8);
  if (recOn && !play.on) cursor = (s + noteRes) % g.steps;
  drag = sel === 'drums' ? null : { n, g };
  drawRoll(); drawOverview();
});
addEventListener('mousemove', e => {
  if (!drag) return;
  const r = roll.getBoundingClientRect(), step = Math.floor((e.clientX - r.left - GUT) / drag.g.px);
  const l = Math.max(noteRes, Math.ceil((step + 1 - drag.n.s) / noteRes) * noteRes);
  const nl = Math.min(l, drag.g.steps - drag.n.s);
  if (nl !== drag.n.l) { drag.n.l = nl; drawRoll(); }
});
addEventListener('mouseup', () => { if (drag) { drag = null; drawOverview(); save(); } });
$('#barRow').addEventListener('mousedown', e => { // click empty ruler area -> move step cursor
  if (e.target.id !== 'barRow') return;
  const g = rollGeom(), x = e.clientX - $('#barRow').getBoundingClientRect().left - GUT;
  if (x < 0) return;
  cursor = Math.floor(clamp(x / g.px, 0, g.steps - 1) / noteRes) * noteRes; drawRoll(); updateHints();
});

// computer keyboard
const typing = e => ['INPUT', 'SELECT', 'TEXTAREA'].includes(e.target.tagName) && e.target.type !== 'range';
addEventListener('keydown', e => {
  if (typing(e)) return;
  if (e.ctrlKey && e.key.toLowerCase() === 'z') { e.preventDefault(); return undo(); }
  if (e.code === 'Space') { e.preventDefault(); return play.on ? stopPlay() : startPlay(); }
  if (e.ctrlKey || e.metaKey || e.altKey || e.repeat) return;
  const i = KEYMAP[e.key.toLowerCase()];
  if (i != null) { e.preventDefault(); noteOn(kbBase + i); }
});
addEventListener('keyup', e => { const i = KEYMAP[e.key.toLowerCase()]; if (i != null) noteOff(kbBase + i); });
addEventListener('blur', () => [...held.keys()].forEach(noteOff));
let rsz; addEventListener('resize', () => { clearTimeout(rsz); rsz = setTimeout(() => { drawOverview(); renderBarRow(); drawRoll(); }, 80); });

// ---------- boot ----------
if (!load()) newSong();
document.querySelectorAll('#kbOct button').forEach(b => b.classList.toggle('on', +b.dataset.o === kbBase));
renderAll(); renderKB();
requestAnimationFrame(frame);
</script>
</body>
